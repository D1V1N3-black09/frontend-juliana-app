<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Panel de Administración - Beautiful Girl</title>
        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <!-- Font Awesome -->
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <!-- DataTables CSS -->
        <link
            href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css"
            rel="stylesheet">
        <!-- Custom CSS -->
        <link rel="stylesheet" href="../../assets/css/style.css">
        <style>
        .sidebar {
            min-height: 100vh;
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, .1);
        }
        .sidebar-sticky {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            height: calc(100vh - 48px);
            padding-top: .5rem;
            overflow-x: hidden;
            overflow-y: auto;
        }
        .admin-content {
            padding-top: 1.5rem;
        }
    </style>
    </head>
    <body>
        <div class="container-fluid">
            <div class="row">
                <!-- Sidebar -->
                <nav id="sidebar"
                    class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
                    <div class="position-sticky sidebar-sticky pt-3">
                        <div class="text-center mb-4">
                            <h6
                                class="sidebar-heading px-3 mt-4 mb-1 text-muted">
                                <span>Panel de Administración</span>
                            </h6>
                        </div>
                        <ul class="nav flex-column">
                            <li class="nav-item">
                                <a class="nav-link active" href="#dashboard">
                                    <i class="fas fa-tachometer-alt me-2"></i>
                                    Dashboard
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#products">
                                    <i class="fas fa-box me-2"></i>
                                    Productos
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#orders">
                                    <i class="fas fa-shopping-cart me-2"></i>
                                    Órdenes
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#customers">
                                    <i class="fas fa-users me-2"></i>
                                    Clientes
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#reports">
                                    <i class="fas fa-chart-bar me-2"></i>
                                    Reportes
                                </a>
                            </li>
                        </ul>

                        <hr class="my-3">

                        <div class="px-3">
                            <button
                                class="btn btn-outline-danger w-100 logout-btn">
                                <i class="fas fa-sign-out-alt me-2"></i>
                                Cerrar Sesión
                            </button>
                        </div>
                    </div>
                </nav>

                <!-- Main Content -->
                <main
                    class="col-md-9 ms-sm-auto col-lg-10 px-md-4 admin-content">
                    <!-- Header -->
                    <div
                        class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2">Dashboard</h1>
                        <div class="btn-toolbar mb-2 mb-md-0">
                            <div class="btn-group me-2">
                                <button type="button"
                                    class="btn btn-sm btn-outline-secondary">Compartir</button>
                                <button type="button"
                                    class="btn btn-sm btn-outline-secondary">Exportar</button>
                            </div>
                            <button type="button"
                                class="btn btn-sm btn-outline-secondary dropdown-toggle">
                                <i class="fas fa-calendar me-1"></i>
                                Esta semana
                            </button>
                        </div>
                    </div>

                    <!-- Dashboard Content -->
                    <div class="row g-4 mb-4">
                        <!-- Stats Cards -->
                        <div class="col-12 col-sm-6 col-lg-3">
                            <div class="card border-0 shadow-sm">
                                <div class="card-body">
                                    <h6 class="text-muted mb-2">Ventas
                                        Totales</h6>
                                    <h3 class="mb-0">$12,345</h3>
                                    <small class="text-success">
                                        <i class="fas fa-arrow-up me-1"></i>
                                        12% vs mes anterior
                                    </small>
                                </div>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6 col-lg-3">
                            <div class="card border-0 shadow-sm">
                                <div class="card-body">
                                    <h6 class="text-muted mb-2">Órdenes
                                        Nuevas</h6>
                                    <h3 class="mb-0">123</h3>
                                    <small class="text-success">
                                        <i class="fas fa-arrow-up me-1"></i>
                                        5% vs mes anterior
                                    </small>
                                </div>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6 col-lg-3">
                            <div class="card border-0 shadow-sm">
                                <div class="card-body">
                                    <h6 class="text-muted mb-2">Clientes
                                        Nuevos</h6>
                                    <h3 class="mb-0">45</h3>
                                    <small class="text-success">
                                        <i class="fas fa-arrow-up me-1"></i>
                                        8% vs mes anterior
                                    </small>
                                </div>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6 col-lg-3">
                            <div class="card border-0 shadow-sm">
                                <div class="card-body">
                                    <h6 class="text-muted mb-2">Visitas</h6>
                                    <h3 class="mb-0">1,234</h3>
                                    <small class="text-danger">
                                        <i class="fas fa-arrow-down me-1"></i>
                                        3% vs mes anterior
                                    </small>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Charts -->
                    <div class="row g-4">
                        <div class="col-12 col-lg-8">
                            <div class="card border-0 shadow-sm">
                                <div class="card-body">
                                    <h5 class="card-title">Ventas por Mes</h5>
                                    <canvas id="salesChart"></canvas>
                                </div>
                            </div>
                        </div>
                        <div class="col-12 col-lg-4">
                            <div class="card border-0 shadow-sm">
                                <div class="card-body">
                                    <h5 class="card-title">Productos más
                                        Vendidos</h5>
                                    <canvas id="productsChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Bootstrap Bundle with Popper -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Chart.js -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <!-- DataTables -->
        <script
            src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
        <script
            src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
        <!-- Custom JS -->
        <script src="../../assets/js/auth.js"></script>
        <script src="../../assets/js/admin.js"></script>
    </body>
</html>
