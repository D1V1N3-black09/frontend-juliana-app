<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Email - Beautiful Girl</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
        body {
            padding-top: 76px;
        }

        .verification-section {
            min-height: calc(100vh - 76px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
            background: linear-gradient(135deg, var(--pink-accent) 0%, var(--pink-dark) 100%);
        }

        .verification-container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px var(--pink-shadow);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .verify-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--pink-accent) 0%, var(--pink-dark) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            color: white;
            font-size: 40px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .otp-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 30px 0;
        }

        .otp-input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .otp-input:focus {
            border-color: var(--pink-accent);
            box-shadow: 0 0 0 0.2rem var(--pink-shadow);
            outline: none;
        }

        .otp-input.filled {
            border-color: #28a745;
            background-color: #f0fff4;
        }

        .timer {
            text-align: center;
            font-size: 18px;
            color: #666;
            margin: 20px 0;
            font-weight: 500;
        }

        .timer.expired {
            color: #dc3545;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .timer i {
            margin-right: 8px;
        }

        .btn-verify {
            background: linear-gradient(135deg, var(--pink-accent) 0%, var(--pink-dark) 100%);
            border: none;
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .btn-verify:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px var(--pink-shadow);
            color: white;
        }

        .btn-verify:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-resend {
            background: none;
            border: 2px solid var(--pink-accent);
            color: var(--pink-accent);
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            width: 100%;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .btn-resend:hover:not(:disabled) {
            background: var(--pink-accent);
            color: white;
        }

        .btn-resend:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .info-box {
            background: var(--pink-lighter);
            border-left: 4px solid var(--pink-accent);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
        }

        .info-box i {
            color: var(--pink-accent);
            margin-right: 10px;
        }

        .back-link {
            color: var(--pink-dark);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--pink-accent);
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <header class="fixed-top">
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold" href="../index.html">
                    <span class="text-primary">Beautiful</span>Girl
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="products.html">Productos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="about.html">Nosotros</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contact.html">Contacto</a>
                        </li>
                        <li class="nav-item ms-3">
                            <a href="login.html" class="btn btn-outline-primary btn-sm">
                                <i class="fas fa-user me-1"></i> Iniciar Sesión
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Verification Section -->
    <section class="verification-section">
        <div class="verification-container">
            <div class="verify-icon">
                <i class="fas fa-envelope"></i>
            </div>

            <h3 class="mb-3">Verifica tu Email</h3>
            <p class="text-muted mb-4">
                Hemos enviado un código de 6 dígitos a<br>
                <strong class="text-primary" id="userEmail">tu correo electrónico</strong>
            </p>

            <div class="otp-inputs">
                <input type="text" class="otp-input" maxlength="1" id="otp1" autofocus>
                <input type="text" class="otp-input" maxlength="1" id="otp2">
                <input type="text" class="otp-input" maxlength="1" id="otp3">
                <input type="text" class="otp-input" maxlength="1" id="otp4">
                <input type="text" class="otp-input" maxlength="1" id="otp5">
                <input type="text" class="otp-input" maxlength="1" id="otp6">
            </div>

            <div class="timer" id="timer">
                <i class="fas fa-clock"></i>
                <span id="timerText">15:00</span>
            </div>

            <div class="info-box">
                <i class="fas fa-info-circle"></i>
                <small>
                    <strong>Importante:</strong> El código expira en 15 minutos.
                    Revisa tu carpeta de spam si no lo recibes.
                </small>
            </div>

            <button class="btn btn-verify" id="verifyBtn" disabled>
                <i class="fas fa-check-circle me-2"></i>Verificar Email
            </button>

            <button class="btn btn-resend" id="resendBtn">
                <i class="fas fa-paper-plane me-2"></i>Reenviar Código
            </button>

            <div class="text-center mt-4">
                <a href="login.html" class="back-link">
                    <i class="fas fa-arrow-left me-2"></i>Volver al Login
                </a>
            </div>
        </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Custom Scripts -->
    <script src="../assets/js/sweetalert-config.js"></script>
    <script>
        // Variables globales
        let userEmail = '';
        let timerInterval = null;
        let timeLeft = 900; // 15 minutos en segundos
        
        // Inicializar al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            // Obtener email de sessionStorage
            userEmail = sessionStorage.getItem('verificationEmail');
            
            if (!userEmail) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'No se encontró el email a verificar',
                    confirmButtonText: 'Ir a Registro'
                }).then(() => {
                    window.location.href = 'register.html';
                });
                return;
            }
            
            // Mostrar email
            document.getElementById('userEmail').textContent = userEmail;
            
            // Iniciar temporizador
            startTimer();
            
            // Configurar inputs OTP
            setupOTPInputs();
        });
        
        // Configurar comportamiento de inputs OTP
        function setupOTPInputs() {
            const inputs = document.querySelectorAll('.otp-input');
            
            inputs.forEach((input, index) => {
                // Evento input
                input.addEventListener('input', (e) => {
                    const value = e.target.value;
                    
                    // Solo permitir números
                    e.target.value = value.replace(/[^0-9]/g, '');
                    
                    // Marcar como lleno
                    if (e.target.value) {
                        e.target.classList.add('filled');
                        // Mover al siguiente input
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        }
                    } else {
                        e.target.classList.remove('filled');
                    }
                    
                    // Verificar si todos están llenos
                    checkAllFilled();
                });
                
                // Evento keydown para backspace
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
                
                // Evento paste
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text');
                    const digits = pastedData.replace(/[^0-9]/g, '').slice(0, 6);
                    
                    digits.split('').forEach((digit, i) => {
                        if (inputs[i]) {
                            inputs[i].value = digit;
                            inputs[i].classList.add('filled');
                        }
                    });
                    
                    checkAllFilled();
                });
            });
        }
        
        // Verificar si todos los inputs están llenos
        function checkAllFilled() {
            const inputs = document.querySelectorAll('.otp-input');
            const allFilled = Array.from(inputs).every(input => input.value.length === 1);
            document.getElementById('verifyBtn').disabled = !allFilled;
        }
        
        // Obtener código OTP completo
        function getOTPCode() {
            const inputs = document.querySelectorAll('.otp-input');
            return Array.from(inputs).map(input => input.value).join('');
        }
        
        // Temporizador
        function startTimer() {
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimerExpired();
                }
            }, 1000);
        }
        
        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const timerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            const timerElement = document.getElementById('timer');
            document.getElementById('timerText').textContent = timerText;
            
            // Cambiar color cuando quedan menos de 2 minutos
            if (timeLeft < 120) {
                timerElement.classList.add('expired');
            }
        }
        
        function handleTimerExpired() {
            const timerElement = document.getElementById('timer');
            timerElement.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Código expirado';
            timerElement.classList.add('expired');
            
            // Deshabilitar botón de verificar
            document.getElementById('verifyBtn').disabled = true;
            
            Swal.fire({
                icon: 'warning',
                title: 'Código Expirado',
                text: 'El código de verificación ha expirado. Solicita uno nuevo.',
                confirmButtonText: 'Reenviar Código'
            }).then((result) => {
                if (result.isConfirmed) {
                    resendCode();
                }
            });
        }
        
        // Verificar código
        document.getElementById('verifyBtn').addEventListener('click', async () => {
            const code = getOTPCode();
            const btn = document.getElementById('verifyBtn');
            
            // Deshabilitar botón
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Verificando...';
            
            try {
                const response = await fetch('http://localhost:5000/api/email-verification/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: userEmail,
                        token: code
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // Detener temporizador
                    clearInterval(timerInterval);
                    
                    // Limpiar sessionStorage
                    sessionStorage.removeItem('verificationEmail');
                    
                    // Mostrar éxito
                    await Swal.fire({
                        icon: 'success',
                        title: '¡Email Verificado!',
                        text: 'Tu cuenta ha sido verificada exitosamente',
                        confirmButtonText: 'Iniciar Sesión'
                    });
                    
                    // Redirigir al login
                    window.location.href = 'login.html';
                } else {
                    // Error en la verificación
                    Swal.fire({
                        icon: 'error',
                        title: 'Código Incorrecto',
                        text: data.error || 'El código ingresado no es válido',
                        confirmButtonText: 'Intentar de Nuevo'
                    });
                    
                    // Limpiar inputs
                    clearOTPInputs();
                    
                    // Rehabilitar botón
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fas fa-check-circle me-2"></i>Verificar Email';
                }
            } catch (error) {
                console.error('Error al verificar:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error de Conexión',
                    text: 'No se pudo conectar con el servidor',
                    confirmButtonText: 'OK'
                });
                
                // Rehabilitar botón
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle me-2"></i>Verificar Email';
            }
        });
        
        // Reenviar código
        document.getElementById('resendBtn').addEventListener('click', () => {
            resendCode();
        });
        
        async function resendCode() {
            const btn = document.getElementById('resendBtn');
            
            // Deshabilitar botón
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Enviando...';
            
            try {
                const response = await fetch('http://localhost:5000/api/email-verification/resend', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: userEmail
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // Reiniciar temporizador
                    clearInterval(timerInterval);
                    timeLeft = 900;
                    document.getElementById('timer').classList.remove('expired');
                    startTimer();
                    
                    // Limpiar inputs
                    clearOTPInputs();
                    
                    // Mostrar éxito
                    Swal.fire({
                        icon: 'success',
                        title: 'Código Reenviado',
                        text: 'Se ha enviado un nuevo código a tu email',
                        timer: 2000,
                        showConfirmButton: false
                    });
                    
                    // Rehabilitar botón después de 60 segundos
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Reenviar Código';
                    }, 60000);
                } else {
                    throw new Error(data.error || 'Error al reenviar código');
                }
            } catch (error) {
                console.error('Error al reenviar:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: error.message || 'No se pudo reenviar el código',
                    confirmButtonText: 'OK'
                });
                
                // Rehabilitar botón
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Reenviar Código';
            }
        }
        
        // Limpiar inputs OTP
        function clearOTPInputs() {
            const inputs = document.querySelectorAll('.otp-input');
            inputs.forEach(input => {
                input.value = '';
                input.classList.remove('filled');
            });
            inputs[0].focus();
            document.getElementById('verifyBtn').disabled = true;
        }
    </script>
</body>
</html>
